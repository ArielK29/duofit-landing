<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DuoFit — מצא את בן הזוג הבא שלך לאימונים</title>
<style>
  :root {
    --bg: #050505;
    --surface: #0D0D0D;
    --surface-hover: #1A1A1A;
    --text: #F5F5F5;
    --text-secondary: #A0A0A0;
    --magenta: #FF00A8;
    --cyan: #00E5FF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .logo {
    font-size: 48px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 36px;
    margin: 0 0 12px;
    background: linear-gradient(90deg, var(--magenta), var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.subtitle {
    color: var(--text-secondary);
    font-size: 18px;
    max-width: 480px;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .badge {
    display: inline-block;
    background: var(--surface);
    border: 1px solid var(--surface-hover);
    color: var(--cyan);
    padding: 10px 24px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: bold;
  }
  footer {
    position: absolute;
    bottom: 16px;
    color: var(--text-secondary);
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="logo">🏋️</div>
  <h1>DuoFit</h1>
  <p class="subtitle">מצא בן/בת זוג לאימונים באזור שלך. התחברות מדויקת, שותפים אמיתיים, ריצה משותפת — בקרוב ב-DuoFit.</p>
  <div class="badge">בקרוב 🚀 — הצטרפו לרשימת ההמתנה</div>
  <footer>DuoFit &copy; 2026</footer>
</body>
</html>
